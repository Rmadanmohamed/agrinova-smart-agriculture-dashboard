name: Engineering quality
on:
  pull_request:
  push:
    branches: ['audit/phase2-powerbi-portability']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci && npx --no-install tsc --noEmit && npm run build
      - run: npm ci && npm run build
        working-directory: Dashboard/web/backend
      - run: npm ci && npm run build
        working-directory: Dashboard/web/frontend
